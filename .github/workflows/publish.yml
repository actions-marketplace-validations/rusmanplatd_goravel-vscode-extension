name: Publish Extension & goravel-lsp CLI

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (gate for publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Go static analysis (go vet)
        run: npm run vet:server

      - name: Run Go tests
        run: npm run test:server

      - name: Run Go tests (race detector)
        run: npm run test:server:race

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run TypeScript client & config tests
        run: npm run test:client

      - name: Run installer & GitHub Action tests
        run: npm run test:scripts

      - name: Build server and client bundle
        run: npm run build

      - name: Validate VSIX packaging
        run: |
          mkdir -p dist
          npx vsce package --no-dependencies --out dist/
          ls -lh dist/goravel-vscode-*.vsix

  publish:
    name: Publish (VS Code Marketplace, Open VSX, GitHub Release / Marketplace Action)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform goravel-lsp binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT_DIR="$(pwd)/dist/releases"
          mkdir -p "$OUT_DIR"

          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            STAGE_DIR="$(mktemp -d)"
            BIN_NAME="goravel-lsp${EXT}"
            RAW_BIN_NAME="goravel-lsp-${GOOS}-${GOARCH}${EXT}"

            echo "Building ${GOOS}/${GOARCH}..."
            (
              cd server
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
                -o "${STAGE_DIR}/${BIN_NAME}" .
            )

            cp "${STAGE_DIR}/${BIN_NAME}" "${OUT_DIR}/${RAW_BIN_NAME}"
            cp LICENSE "${STAGE_DIR}/"

            if [ "$GOOS" = "windows" ]; then
              ARCHIVE_NAME="goravel-lsp-${VERSION}-${GOOS}-${GOARCH}.zip"
              (cd "$STAGE_DIR" && zip -q "${OUT_DIR}/${ARCHIVE_NAME}" "$BIN_NAME" LICENSE)
            else
              ARCHIVE_NAME="goravel-lsp-${VERSION}-${GOOS}-${GOARCH}.tar.gz"
              tar -czf "${OUT_DIR}/${ARCHIVE_NAME}" -C "$STAGE_DIR" "$BIN_NAME" LICENSE
            fi

            rm -rf "$STAGE_DIR"
          done

          (
            cd "$OUT_DIR"
            sha256sum goravel-lsp-* > "goravel-lsp-${VERSION}-checksums.txt"
            cp "goravel-lsp-${VERSION}-checksums.txt" "checksums.txt"
          )
          ls -lh "$OUT_DIR"

      - name: Package extension
        run: npm run package

      - name: Upload VSIX & CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goravel-release-artifacts
          path: |
            dist/goravel-vscode-*.vsix
            dist/releases/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/goravel-vscode-*.vsix
            dist/releases/*
          generate_release_notes: true

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx vsce publish --oidc --packagePath dist/goravel-vscode-*.vsix

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx --yes ovsx publish --packagePath dist/goravel-vscode-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
